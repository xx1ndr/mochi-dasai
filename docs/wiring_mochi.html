<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Wiring mochi dasai - gaya breadboard</title>
<style>
  @page { size: A3 landscape; margin: 6mm; }
  html,body { margin:0; padding:0; background:#fff; }
  svg { display:block; }
  .lbl { font: 11px Arial, sans-serif; fill:#1b1b1b; }
  .lblw { font: 11px Arial, sans-serif; fill:#fff; }
  .tiny { font: 9px Arial, sans-serif; fill:#222; }
  .tinyl { font: 9px Arial, sans-serif; fill:#e8e8e8; }
  .chip { font: bold 12px Arial, sans-serif; fill:#e9e9e9; }
  .pin { font: bold 9px Arial, sans-serif; fill:#2b2000; }
  .w { fill:none; stroke-width:5.5; stroke-linecap:round; stroke-linejoin:round; }
  .yel { stroke:#f2d400; } .grn { stroke:#33a44a; }
  .red { stroke:#d92b22; } .blk { stroke:#1b1b1b; }
</style>
</head>
<body>
<svg width="1700" height="1200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="holes" width="15" height="15" patternUnits="userSpaceOnUse">
    <circle cx="7.5" cy="7.5" r="2.1" fill="#9aa0a6"/>
    <circle cx="7.5" cy="6.9" r="1.4" fill="#d9dde0"/>
  </pattern>
  <linearGradient id="pcbBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a78c8"/><stop offset="1" stop-color="#14508c"/>
  </linearGradient>
  <linearGradient id="pcbPurple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9b45c4"/><stop offset="1" stop-color="#67238a"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2f4f6"/><stop offset="0.5" stop-color="#aeb6bd"/><stop offset="1" stop-color="#7b858e"/>
  </linearGradient>
  <linearGradient id="cell" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f5f9e"/><stop offset="0.5" stop-color="#3b8fd0"/><stop offset="1" stop-color="#174b7d"/>
  </linearGradient>
</defs>

<!-- ===================== KABEL (digambar dulu, komponen di atasnya) ===================== -->
<!-- 3V3 kuning -->
<path class="w yel" d="M1080,320 H960 V540 H680"/>
<path class="w yel" d="M1380,340 H1000 V540 H686"/>
<path class="w yel" d="M1040,520 H948 V540 H692"/>
<!-- GND hijau -->
<path class="w grn" d="M1130,320 H990 V580 H680"/>
<path class="w grn" d="M1430,340 H1020 V580 H686"/>
<path class="w grn" d="M1075,520 H996 V580 H692"/>
<path class="w grn" d="M1180,760 H1005 V740 H680"/>
<!-- SDA / SCL hitam -->
<path class="w blk" d="M1230,320 H1030 V620 H680"/>
<path class="w blk" d="M1180,320 H1040 V660 H680"/>
<!-- GPS TX/RX hitam -->
<path class="w blk" d="M1480,340 H1060 V700 H680"/>
<path class="w blk" d="M1530,340 H1070 V800 H320 V660 H360"/>
<!-- TTP OUT hitam -->
<path class="w blk" d="M1110,520 H1080 V700 H360"/>
<!-- ADC & CHRG hitam -->
<path class="w blk" d="M1080,1000 H1090 V580 H360"/>
<path class="w blk" d="M1460,540 H1100 V620 H360"/>
<!-- Power merah: baterai -> TP4056 -> boost -> sakelar -> VIN -->
<path class="w red" d="M1420,780 H1330 V540 H1320"/>
<path class="w red" d="M1400,540 H1250 V760 H1040"/>
<path class="w red" d="M1140,760 H1160 V700 H1310"/>
<path class="w red" d="M1370,700 H1380 V540 H360"/>
<!-- USB 5V masuk TP4056 -->
<path class="w red" d="M1180,470 H1160 V540 H1240"/>
<path class="w grn" d="M1215,470 H1235 V540 H1280"/>

<!-- ===================== BREADBOARD ===================== -->
<rect x="100" y="120" width="800" height="960" rx="12" fill="#f4f4f2" stroke="#9aa0a6" stroke-width="2"/>
<!-- rel atas -->
<rect x="116" y="150" width="768" height="28" fill="#d72626"/>
<rect x="116" y="188" width="768" height="28" fill="#1b6fbf"/>
<rect x="116" y="150" width="768" height="28" fill="url(#holes)" opacity="0.55"/>
<!-- area terminal atas -->
<rect x="116" y="236" width="768" height="424" fill="#eef4ee" stroke="#c7cfc7"/>
<rect x="116" y="236" width="768" height="424" fill="url(#holes)"/>
<line x1="500" y1="236" x2="500" y2="660" stroke="#c7cfc7" stroke-width="1.5"/>
<!-- celah tengah -->
<rect x="116" y="664" width="768" height="32" fill="#e4e4e1"/>
<!-- rel bawah -->
<rect x="116" y="704" width="768" height="28" fill="#1b6fbf"/>
<rect x="116" y="742" width="768" height="28" fill="#d72626"/>
<rect x="116" y="704" width="768" height="28" fill="url(#holes)" opacity="0.55"/>
<!-- area terminal bawah -->
<rect x="116" y="782" width="768" height="262" fill="#eef4ee" stroke="#c7cfc7"/>
<rect x="116" y="782" width="768" height="262" fill="url(#holes)"/>
<line x1="500" y1="782" x2="500" y2="1044" stroke="#c7cfc7" stroke-width="1.5"/>
<text class="tiny" x="125" y="144">+ rail</text>
<text class="tiny" x="125" y="216">- rail</text>
<text class="tiny" x="125" y="738">- rail</text>
<text class="tiny" x="125" y="776">+ rail</text>

<g>
  <rect x="360" y="500" width="320" height="260" rx="12" fill="url(#pcbPurple)" stroke="#4b1768" stroke-width="2"/>

  <rect x="330" y="592" width="38" height="58" rx="7" fill="url(#metal)" stroke="#555" stroke-width="1.5"/>
  <rect x="336" y="602" width="26" height="38" rx="5" fill="#202428"/>

  <text class="tinyl" x="491" y="610" text-anchor="middle">SUPER MINI</text>
  <!-- antenna trace -->
  <path d="M566,536 H650 V556 H620 V576 H650" fill="none" stroke="#d8b6e8" stroke-width="3"/>

    <rect x="672" y="700" width="14" height="24" rx="2"/><rect x="672" y="740" width="14" height="24" rx="2"/>
  </g>
  <g class="pin">
    <text x="338" y="556" text-anchor="end">5V</text><text x="338" y="596" text-anchor="end">GND</text>
    <text x="338" y="636" text-anchor="end">A1</text><text x="338" y="676" text-anchor="end">2</text>
    <text x="338" y="716" text-anchor="end">5</text><text x="338" y="756" text-anchor="end">3</text>
    <text x="694" y="556">3V3</text><text x="694" y="596">GND</text>
    <text x="694" y="636">20</text><text x="694" y="676">21</text>
    <text x="694" y="716">4</text><text x="694" y="756">GND</text>
  </g>
</g>
