<text class="s" x="75" y="1620">Gambar modul adalah ilustrasi bentuk fisik; posisi pin mengikuti modul yang umum dijual. Cek lagi label pin di PCB-mu sebelum menyambung.</text>

<rect x="60" y="1660" width="1580" height="180" rx="8" fill="#f0f7f0" stroke="#7aa87a"/>
<text class="head" x="75" y="1692">Urutan pasang (penting)</text>
<text class="s" x="75" y="1720">1. TP4056: USB 5V ke IN+/-, baterai ke B+/-, OUT+/- ke boost. Jangan balik polaritas baterai.</text>
<text class="s" x="75" y="1748">2. Set pot MT3608 sampai OUT = 5.0 V (ukur dengan multimeter) SEBELUM disambung ke ESP32.</text>
<text class="s" x="75" y="1776">3. Sakelar dipasang seri di jalur 5V ke ESP32. Ground semua modul disatukan di satu titik.</text>
<text class="s" x="75" y="1804">4. OLED, GPS, TTP223 ambil 3V3. Baterai ke ADC lewat pembagi 100k/100k; CHRG ke GPIO2 (aktif LOW).</text>
<text class="s" x="75" y="1832">5. USB-C ESP32 tetap dipakai bridge WhatsApp (COM8). OLED 1.3 inch pakai OLED_SH1106 = 1.</text>
