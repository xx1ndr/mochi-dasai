<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Wiring Mochi Dasai — Sambung yang Warna Sama</title>
<style>
  @page { size: A3 landscape; margin: 0; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; width:1587px; height:1122px; overflow:hidden; background:#fff; }
  body {
    font-family:"Segoe UI",Arial,sans-serif;
    color:#12212c;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .page { position:relative; width:1587px; height:1122px; overflow:hidden; background:#fff; }

  h1 { position:absolute; left:36px; top:20px; margin:0; font-size:40px; line-height:1.05; letter-spacing:-.4px; color:#0b2b45; }
  h1 b { color:#d21f1f; }
  .sub { position:absolute; left:38px; top:76px; font-size:21px; color:#42596a; }
  .sub b { color:#0b2b45; }
  .warn {
    position:absolute; left:36px; right:36px; top:124px; height:58px;
    border:2px solid #e3c392; border-radius:12px; background:#fff7ea;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:800; color:#8a4b0b; text-align:center;
  }
  .foot {
    position:absolute; left:38px; right:38px; bottom:12px;
    font-size:13px; color:#7a8b97; text-align:center;
  }

  .wires, .labels, .dots { position:absolute; left:0; top:0; width:1587px; height:1122px; }
  .wires { z-index:1; } .labels { z-index:6; } .dots { z-index:8; }
  .under { fill:none; stroke:#fff; stroke-width:13; stroke-linecap:round; stroke-linejoin:round; }
  .w { fill:none; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
  .red { stroke:#d21f1f; } .blk { stroke:#222; } .org { stroke:#e07c00; }
  .blu { stroke:#1567c8; } .grn { stroke:#15913c; } .pur { stroke:#8038b8; }
  .wl { font:bold 14px "Segoe UI",Arial; fill:#12212c; paint-order:stroke; stroke:#fff; stroke-width:5px; stroke-linejoin:round; }
  .cap { font:bold 15px "Segoe UI",Arial; fill:#0b2b45; paint-order:stroke; stroke:#fff; stroke-width:4px; }
  .pn { font:bold 12px "Segoe UI",Arial; fill:#12212c; paint-order:stroke; stroke:#fff; stroke-width:4px; }

  .photo {
    position:absolute; z-index:3;
    border:2px solid #c8d7e2; border-radius:12px; background:#f8fafc;
    overflow:hidden; box-shadow:0 3px 10px rgba(16,42,64,.10);
  }
  .photo img { width:100%; height:100%; object-fit:contain; display:block; }
  .usb {
    position:absolute; z-index:3; left:40px; top:205px; width:160px; height:74px;
    border:2px solid #c8d7e2; border-radius:12px; background:#f8fafc;
    box-shadow:0 3px 10px rgba(16,42,64,.10);
  }
  .usb span { position:absolute; left:14px; top:22px; font:bold 20px "Segoe UI",Arial; color:#0b2b45; }
</style>
</head>
<body>
<section class="page">

  <h1>WIRING MOCHI DASAI — <b>SAMBUNG YANG WARNA SAMA</b></h1>
  <div class="sub">Ikuti <b>titik warnanya</b>. Tidak perlu paham GPIO dulu.</div>
  <div class="warn">Tanpa boost • Tanpa GPS • Tanpa breadboard • Matikan sakelar saat upload USB-C.</div>

  <!-- ===================== KABEL (jalur lurus, 90°) ===================== -->
  <svg class="wires" width="1587" height="1122" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d21f1f"/></marker>
      <marker id="arOrg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e07c00"/></marker>
      <marker id="arBlu" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1567c8"/></marker>
      <marker id="arGrn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15913c"/></marker>
      <marker id="arPur" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8038b8"/></marker>
    </defs>

    <!-- daya kiri: empat jalur berurutan, tidak bersilang -->
    <path class="under" d="M200 232 H242 V376 H250"/><path class="w red" d="M200 232 H242 V376 H250" marker-end="url(#arRed)"/>
    <path class="under" d="M200 258 H238 V404 H250"/><path class="w blk" d="M200 258 H238 V404 H250"/>
    <path class="under" d="M210 374 H234 V432 H250"/><path class="w red" d="M210 374 H234 V432 H250" marker-end="url(#arRed)"/>
    <path class="under" d="M210 446 H230 V460 H250"/><path class="w blk" d="M210 446 H230 V460 H250"/>

    <!-- oranye: TP4056 -> sakelar -->
    <path class="under" d="M530 494 H525 V624 H550"/><path class="w org" d="M530 494 H525 V624 H550" marker-end="url(#arOrg)"/>
    <!-- ungu: baterai -> ADC dan CHRG -> ESP32 -->
    <path class="under" d="M210 482 H235 V490 H780 V560"/><path class="w pur" d="M210 482 H235 V490 H780 V560" marker-end="url(#arPur)"/>
    <path class="under" d="M530 580 H780 V620"/><path class="w pur" d="M530 580 H780 V620" marker-end="url(#arPur)"/>
    <!-- oranye: sakelar -> ESP32 -->
    <path class="under" d="M720 682 H770 V750 H790"/><path class="w org" d="M720 682 H770 V750 H790" marker-end="url(#arOrg)"/>

    <!-- hitam: satu jalur GND di bawah, cabang naik ke modul -->
    <path class="under" d="M250 460 H205 V900 H1570"/><path class="w blk" d="M250 460 H205 V900 H1570"/>
    <path class="under" d="M400 600 V900"/><path class="w blk" d="M400 600 V900"/>
    <path class="under" d="M850 750 V900"/><path class="w blk" d="M850 750 V900"/>
    <path class="under" d="M1470 470 H1570 V900"/><path class="w blk" d="M1470 470 H1570 V900"/>
    <path class="under" d="M1470 780 H1520 V900"/><path class="w blk" d="M1470 780 H1520 V900"/>

    <!-- merah: 3V3 bercabang ke OLED dan TTP223 -->
    <path class="under" d="M1280 350 V320 H1370"/><path class="w red" d="M1280 350 V320 H1370"/>
    <path class="under" d="M1290 320 V303 H1375"/><path class="w red" d="M1290 320 V303 H1375" marker-end="url(#arRed)"/>
    <path class="under" d="M1370 320 V617 H1375"/><path class="w red" d="M1370 320 V617 H1375" marker-end="url(#arRed)"/>

    <!-- biru: dua jalur I2C, urutan sama dari ESP32 ke OLED -->
    <path class="under" d="M1280 450 H1340 V334 H1360"/><path class="w blu" d="M1280 450 H1340 V334 H1360" marker-end="url(#arBlu)"/>
    <path class="under" d="M1280 490 H1350 V404 H1360"/><path class="w blu" d="M1280 490 H1350 V404 H1360" marker-end="url(#arBlu)"/>
    <!-- hijau: tombol sentuh ke ESP32 -->
    <path class="under" d="M1360 657 H1320 V580 H1280"/><path class="w grn" d="M1360 657 H1320 V580 H1280" marker-end="url(#arGrn)"/>
  </svg>

  <!-- ===================== FOTO MODUL ASLI ===================== -->
  <div class="usb"><span>USB 5V</span></div>
  <div class="photo" style="left:40px;top:320px;width:170px;height:180px"><img src="photos/batt2.png" alt="Baterai asli"></div>

    <text class="wl" x="1290" y="570">hijau → tombol</text>
  </svg>

    <circle cx="550" cy="624" r="10" fill="#e07c00" stroke="#fff" stroke-width="4"/>
